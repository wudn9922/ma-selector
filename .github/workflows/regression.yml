name: regression
on:
  workflow_dispatch:
    inputs:
      asof:
        description: '資料截止日（研究版＝2026-09-24）'
        default: '2026-09-24'
  push:
    branches: ['claude/**']
    paths: ['scripts/regression.py', '.github/workflows/regression.yml', 'core/**']
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install pandas numpy matplotlib pyarrow
      - run: python scripts/regression.py --asof "${{ github.event.inputs.asof || '2026-09-24' }}" | tee regression_out.txt
      - run: cat regression/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: regression, path: regression }
      - name: commit report
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add regression
          git diff --cached --quiet || (git commit -m "Regression report" && git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}")
