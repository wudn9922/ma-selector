name: build-reference
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'   # 每月 1 號
permissions:
  contents: write
concurrency:
  group: build-reference
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy pyarrow
      - run: python scripts/build_reference.py
      - name: commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/reference.parquet data/reference.json
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Update reference distribution"
          for attempt in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push failed (attempt ${attempt}), retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL1: ${{ secrets.DISCORD_WEBHOOK_URL1 }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL1" ]; then echo "No webhook configured"; exit 0; fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"content\":\"ma-selector ${GITHUB_WORKFLOW} 失敗：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$DISCORD_WEBHOOK_URL1" || true
