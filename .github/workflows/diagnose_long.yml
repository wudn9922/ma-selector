name: diagnose-long-selector
# NVO／TMO 長期 selector 診斷（純診斷，不改 production）。asof 2026-09-24，83 檔，同 production_sanity。
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['diagnostics/long_selector/diagnose_long_selector.py', '.github/workflows/diagnose_long.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy matplotlib pyarrow
      - name: long selector diagnosis
        run: python diagnostics/long_selector/diagnose_long_selector.py --asof 2026-09-24 --out diagnostics/long_selector
      - if: always()
        run: test -f diagnostics/long_selector/NVO_TMO_long_diagnosis.md && cat diagnostics/long_selector/NVO_TMO_long_diagnosis.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: commit outputs（只 add diagnostics/long_selector）
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add diagnostics/long_selector
          git diff --cached --quiet || (git commit -m "Long selector diagnosis outputs (NVO/TMO; diagnostic only)" && git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}")
