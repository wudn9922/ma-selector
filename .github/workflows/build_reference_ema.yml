name: build-reference-ema
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 1 * *'   # 每月 1 號，台北 14:20（美股池後 20 分鐘）
  push:
    branches: ['claude/**']
    paths: ['scripts/build_reference.py', 'core/ma.py', '.github/workflows/build_reference_ema.yml']
permissions:
  contents: write
concurrency:
  group: build-reference
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy pyarrow
      - name: EMA 基準分佈（83 檔、EMA 版指標；不動 SMA 的 data/reference.parquet）
        run: python scripts/build_reference.py --kind EMA
      - name: commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/reference_ema.parquet data/reference_ema.json
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Update EMA reference distribution"
          for attempt in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push failed (attempt ${attempt}), retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL1: ${{ secrets.DISCORD_WEBHOOK_URL1 }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL1" ]; then echo "No webhook configured"; exit 0; fi
          curl -sS --fail-with-body -X POST -A 'DiscordBot (https://github.com/wudn9922/ma-selector, 1.0)' -H 'Content-Type: application/json' \
            -d "{\"content\":\"ma-selector ${GITHUB_WORKFLOW} 失敗：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$DISCORD_WEBHOOK_URL1" || echo "::warning::Discord 通知送出失敗"
