name: suitability-validation-open
# SUITABILITY_VALIDATION_30 一次性開封：先 commit A（30 張審閱圖＋封存分數＋原始輸出），之後才給使用者看圖。不印分數。
on:
  push:
    branches: ['claude/suitability-validation']
    paths: ['experiments/suitability_validation/open_validation.py', '.github/workflows/suitability_open.yml']
permissions:
  contents: write
concurrency:
  group: suitability-validation-open
  cancel-in-progress: false
jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install pandas numpy matplotlib pyarrow
      - name: 測試（合成資料）
        run: |
          python experiments/suitability_validation/test_freeze_suitability.py
          python experiments/suitability_validation/test_open_validation.py
      - name: 開封（integrity → 依排名篩選 → 每層 10 檔 → 畫圖；不印分數）
        run: python experiments/suitability_validation/open_validation.py
      - name: commit A：審閱圖＋封存分數＋原始輸出（此時沒有人看過任何結果）
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          for p in experiments/suitability_validation/review_bundle experiments/suitability_validation/raw_outputs experiments/suitability_validation/sealed_scores.json experiments/suitability_validation/execution_record.json experiments/suitability_validation/execution_blocked.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -q -m "SUITABILITY_VALIDATION_30: review bundle, sealed scores, raw outputs (before any review)"
            git pull --rebase -q origin "${GITHUB_REF_NAME}"; git rev-parse HEAD > /tmp/raw_sha.txt; git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: commit B：記錄 commit A 的 SHA
        if: always()
        run: |
          test -f /tmp/raw_sha.txt && test -f experiments/suitability_validation/execution_record.json || { echo "nothing to finalize"; exit 0; }
          python - <<'PY'
          import json
          p = 'experiments/suitability_validation/execution_record.json'; r = json.load(open(p, encoding='utf-8'))
          r['raw_output_commit_sha'] = open('/tmp/raw_sha.txt').read().strip(); r['status'] = 'OPENED_COMMITTED_BEFORE_REVIEW'
          json.dump(r, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2); open(p, 'a').write('\n')
          PY
          git add experiments/suitability_validation/execution_record.json
          git commit -q -m "SUITABILITY_VALIDATION_30: record raw output commit SHA"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"; git push origin "HEAD:${GITHUB_REF_NAME}"
