name: final-rules-experiment
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/final_rule_experiment.py', '.github/workflows/final_rules.yml']
permissions:
  contents: write
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy matplotlib pyarrow
      - name: 最後選擇規則診斷（只讀；gap 固定 15；asof 2026-09-24）
        run: python scripts/final_rule_experiment.py --asof 2026-09-24 --out experiments/final_rules
      - if: always()
        run: test -f experiments/final_rules/rules_report.md && cat experiments/final_rules/rules_report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: commit report
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add experiments
          git diff --cached --quiet || (git commit -m "Final selection rule diagnostic (gap=15, read-only)" && git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}")
